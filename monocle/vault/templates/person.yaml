template: person
note_type: person_note
default_folder: people
description: "Person you know — relationship, personal context, care needs, and organizational ties."

sentence_starters:
  - "I met"
  - "met with"
  - "talked to"
  - "spoke with"
  - "I spoke"
  - "had coffee with"
  - "had lunch with"
  - "caught up with"
  - "I caught up"
  - "introduced to"
  - "got to know"

fields:
  # Identity & Contact
  - name: title
    required: true
    type: string
    description: "Full name or primary name."
  
  - name: email
    required: false
    type: string
    description: "Email address."
  
  - name: phone
    required: false
    type: string
    description: "Phone number."
  
  - name: location
    required: false
    type: string
    description: "City, organization, or primary location."
  
  # Context & Relationships
  - name: people
    required: true
    type: list
    description: "People mentioned in this note. For person notes, include the subject's own name first; used for backlinks and graph edges."
  
  - name: relationship_type
    required: false
    type: string
    description: "How you know them: colleague | member | friend | family | mentor | mentee | acquaintance | contact"
  
  - name: met_context
    required: false
    type: string
    description: "Where/how you met (e.g., 'work', 'conference', 'introduced by Alice', 'church')."
  
  - name: org
    required: false
    type: string
    description: "Primary organization or company for quick filters and summaries."
  
  - name: org_role
    required: false
    type: string
    description: "Their current or most relevant role/title in the primary organization."

  - name: organizations
    required: false
    type: list
    description: >
      Work history and organizational affiliations. Each entry: {name, role, join_date (YYYY-MM),
      leave_date (YYYY-MM or null), current (true/false)}. Used to auto-create structured links
      to organization notes and populate the knowledge graph.

  # Personal Context & Care
  - name: family_context
    required: false
    type: string
    description: "Important family details or relational context (e.g., spouse, children, a baby due, caregiving responsibilities)."

  - name: life_stage
    required: false
    type: string
    description: "Current season of life or major context shaping decisions, stress, or priorities."

  - name: prayer_requests
    required: false
    type: list
    description: "Prayer requests, care needs, burdens, or desired support. Use short phrases."

  - name: care_topics
    required: false
    type: list
    description: "Sensitive or pastoral themes discussed: struggle, sin, grief, health, marriage, parenting, burnout, etc."

  - name: conversation_topics
    required: false
    type: list
    description: "Topics frequently discussed or raised in this interaction: AI, organizational dysfunction, World Cup, leadership, etc."
  
  # Important Dates
  - name: birthdate
    required: false
    type: string
    description: "YYYY-MM-DD format for sorting/reminders. Use partial (e.g. 'MM-DD') if year unknown."
  
  - name: met_date
    required: false
    type: string
    description: "YYYY-MM-DD when you first met. Use partial (e.g. 'YYYY-MM') if exact date unknown."
  
  - name: last_contact_date
    required: false
    type: string
    description: "YYYY-MM-DD of most recent interaction (for filtering by recency). Use partial (e.g. 'YYYY-MM') if exact date unknown."
  
  # Workflow & Follow-up
  - name: next_action
    required: false
    type: string
    description: "Next step: 'Email re: project', 'Coffee catchup', 'Reconnect', etc."
  
  - name: action_items
    required: false
    type: list
  
  - name: priority
    required: false
    type: string
    description: "low | medium | high (for sorting active relationships)."
  
  # Metadata
  - name: domain
    required: false
    type: string
    default: personal
    description: "Category: work | personal | community | faith | etc."
  
  - name: tags
    required: false
    type: list
    description: "Stable interests or descriptors: python, photography, leadership, church, soccer, etc."
  
  - name: status
    required: false
    type: string
    description: "active | inactive | archived (for filtering)."
