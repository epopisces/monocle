template: weekly_summary
note_type: weekly_summary
default_folder: summaries
description: "Auto-generated weekly review and summary."

# Weekly summaries are generated by the WeeklySummaryAgent, not user-initiated,
# so no sentence_starters are needed.
sentence_starters: []

fields:
  - name: title
    required: true
    type: string
    description: "Week label, e.g. 'Week of 2026-03-09'."
  - name: domain
    required: false
    type: string
    default: personal
  - name: tags
    required: false
    type: list
  - name: people
    required: false
    type: list
  - name: action_items
    required: false
    type: list
